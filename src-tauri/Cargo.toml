[package]
name = "dsh-gui"
version = "0.1.0"
description = "DeepSeek Harness desktop shell: a webview that self-hosts the deepseek-harness web UI"
license = "Unlicense"
edition = "2021"
rust-version = "1.77"

# Repo-internal run only (no installer/bundling): the "entry exe" is the debug
# binary this crate produces at target/debug/dsh-gui.exe.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" unlocks the child-webview API (WebviewBuilder / Window::add_child)
# used by `src/views.rs` to host each connection tab in its own WebView2.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-snap-layout = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WebView2 permission-consent handler (src/views.rs). The version must match
# the `webview2-com` that wry pins (0.38) so the COM interface types unify.
webview2-com = "0.38"
# `windows` brings `core::{HSTRING, PCWSTR, Interface}` used to reset the
# persisted notification-permission state (SetPermissionState on the profile).
windows = "0.61"
