[package]
name = "dsh-gui-desktop"
version = "0.1.0"
description = "Console-less launcher shim that runs the dsh-gui desktop build (`npm run desktop`)"
license = "Unlicense"
edition = "2021"
publish = false

# This crate is deliberately standalone: it must build on its own with
# `cargo build --release --manifest-path src-shim/Cargo.toml`, independent of
# the Tauri shell crate under `src-tauri/`. It lives at the repository root
# rather than inside `src-tauri/` because the shim is not part of the dsh-gui
# program itself; the empty `[workspace]` table below makes it its own
# workspace root, so a parent workspace can never capture it by inference.
[workspace]

# No dependencies: the shim only needs `std` (plus `CommandExt::creation_flags`
# and `raw_arg` from `std::os::windows::process`), which keeps the produced exe
# tiny and the build offline.

[profile.release]
strip = true
