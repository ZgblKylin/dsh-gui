<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>快捷助手</title>
<link rel="stylesheet" href="assets/overlay.css?token=__QA_TOKEN__" />
</head>
<body>
<div id="panel" class="panel" role="dialog" aria-label="快捷助手" data-view="home">
  <header class="composer" id="composer">
    <textarea id="input" class="input" rows="1" spellcheck="false" autocomplete="off" aria-label="输入内容" placeholder="输入内容，按 Enter 开始"></textarea>
  </header>

  <main class="content">
    <div class="view view-home" id="view-home">
      <div class="menu" id="menu" role="listbox" aria-label="选择操作">
        <button class="menu-row" type="button" role="option" data-mode="ask" aria-selected="true">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.5 8.5 0 0 1 8.5 8.5Z" /></svg></span>
          <span class="menu-label">回答此问题</span>
          <kbd class="enter-hint">Enter</kbd>
        </button>
        <button class="menu-row" type="button" role="option" data-mode="translate" aria-selected="false">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5 11 14.5" /><path d="M4 14.5 10 8.5 12 5.5" /><path d="M2 5.5h12" /><path d="M7.5 3h1" /><path d="M22 22l-5-10-5 10" /><path d="M14.5 18h5" /></svg></span>
          <span class="menu-label">文本翻译</span>
          <kbd class="enter-hint">Enter</kbd>
        </button>
        <button class="menu-row" type="button" role="option" data-mode="summary" aria-selected="false">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13" /><path d="M8 12h13" /><path d="M8 18h13" /><path d="M3.5 6h.01" /><path d="M3.5 12h.01" /><path d="M3.5 18h.01" /></svg></span>
          <span class="menu-label">内容总结</span>
          <kbd class="enter-hint">Enter</kbd>
        </button>
        <button class="menu-row" type="button" role="option" data-mode="explain" aria-selected="false">
          <span class="menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5" /><path d="M10.5 21h3" /><path d="M12 2.5a6.5 6.5 0 0 0-3.7 11.8V16a1 1 0 0 0 1 1h5.4a1 1 0 0 0 1-1v-1.7A6.5 6.5 0 0 0 12 2.5Z" /></svg></span>
          <span class="menu-label">解释说明</span>
          <kbd class="enter-hint">Enter</kbd>
        </button>
      </div>
    </div>

    <div class="view view-ask" id="view-ask" hidden>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="对话"></div>
    </div>

    <div class="view view-translate" id="view-translate" hidden>
      <div class="columns">
        <section class="translation-column">
          <header class="column-header">
            <span class="column-title">原文</span>
            <div class="lang" id="source-lang"></div>
          </header>
          <div class="column-body" id="source-text" data-empty="输入原文后按 Enter 翻译"></div>
        </section>
        <div class="column-divider" aria-hidden="true"></div>
        <section class="translation-column">
          <header class="column-header">
            <span class="column-title">译文</span>
            <div class="lang" id="target-lang"></div>
          </header>
          <div class="column-body" id="target-text" data-empty="译文将显示在这里"></div>
        </section>
      </div>
    </div>

    <div class="view view-result" id="view-summary" hidden>
      <div class="result" id="summary-result" data-empty="总结结果将显示在这里"></div>
    </div>
    <div class="view view-result" id="view-explain" hidden>
      <div class="result" id="explain-result" data-empty="解释结果将显示在这里"></div>
    </div>
  </main>

  <div class="error-row" id="error-row" hidden>
    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>
    <span class="error-message" id="error-message"></span>
    <button class="retry-btn" id="error-retry" type="button">重试</button>
  </div>

  <footer class="actions">
    <div class="actions-left">
      <button class="ghost-btn" id="back-btn" type="button" hidden title="返回（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></svg>
        <span>返回</span>
      </button>
      <span class="hints" id="home-hints">↑↓ 选择 · Enter 确认 · Esc 关闭</span>
    </div>
    <div class="actions-right">
      <button class="icon-btn pin-btn" id="pin-btn" type="button" aria-pressed="false" title="置顶（失焦不关闭）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5" /><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" /></svg>
        <span class="btn-label" id="pin-label">置顶</span>
      </button>
      <button class="icon-btn" id="close-btn" type="button" title="关闭（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        <span class="btn-label">关闭</span>
      </button>
    </div>
  </footer>
</div>

<script>
  (function () {
    var key = '__QA' + '_TOKEN__';
    window[key] = window[key] || '__QA_TOKEN__';
  })();
</script>
<script src="assets/overlay.js?token=__QA_TOKEN__"></script>
</body>
</html>
